name: Validate OfficeAutoInstaller

on:
  push:
    branches: [main]
    paths:
      - 'OfficeAutoInstaller.ps1'
      - '.github/workflows/validate-office-auto.yml'
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\OfficeAutoInstaller.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            exit 1
          }
          Write-Host "Windows PowerShell parser: OK"

          $bytes = [System.IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE\OfficeAutoInstaller.ps1")
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            Write-Error "OfficeAutoInstaller.ps1 must be UTF-8 with BOM for Windows PowerShell 5.1 Russian text."
            exit 1
          }
          Write-Host "UTF-8 BOM: OK"
